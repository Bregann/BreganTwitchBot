# Runs on every pull request (including Renovate's) and on pushes to main.
# Renovate only auto-merges an update once every job here passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    name: .NET bot (format, build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BreganTwitchBot.sln
      - name: Check formatting
        run: dotnet format BreganTwitchBot.sln --verify-no-changes --no-restore
      - run: dotnet build BreganTwitchBot.sln --no-restore -c Release
      - name: Run tests (Testcontainers uses the runner's Docker)
        run: dotnet test BreganTwitchBot.sln --no-build -c Release
